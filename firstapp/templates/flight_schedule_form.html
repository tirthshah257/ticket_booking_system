{% extends "daashboard2.html" %}
{% load static %}

{%  block AdminBody %}
          <div class="card">
            <div class="card-body">
              <h1 class="card-title">{% if schedule %}Edit Flight Schedule{% else %}Add New Flight Schedule{% endif %}</h1>
              <form method="post" class="forms-sample">
                {% csrf_token %}
                <div class="form-group">
                  <label for="flight">Flight:</label>
                  <select id="flight" name="flight" class="form-control" required>
                    {% for flight in flights %}
                      <option value="{{ flight.pk }}" {% if schedule and schedule.flight.pk == flight.pk %}selected{% endif %}>{{ flight }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="form-group">
                  <label for="departure_airport">Departure Airport:</label>
                  <select id="departure_airport" name="departure_airport" class="form-control" required>
                    {% for airport in airports %}
                      <option value="{{ airport.pk }}" {% if schedule and schedule.departure_airport.pk == airport.pk %}selected{% endif %}>{{ airport }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="form-group">
                  <label for="arrival_airport">Arrival Airport:</label>
                  <select id="arrival_airport" name="arrival_airport" class="form-control" required>
                    {% for airport in airports %}
                      <option value="{{ airport.pk }}" {% if schedule and schedule.arrival_airport.pk == airport.pk %}selected{% endif %}>{{ airport }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="form-group">
                  <label for="departure_time">Departure Time:</label>
                  <input type="datetime-local" id="departure_time" name="departure_time" class="form-control"
                      {% if schedule %}value="{{ schedule.departure_time|date:'Y-m-d\TH:i' }}"{% endif %} required>
                </div>
                <div class="form-group">
                  <label for="arrival_time">Arrival Time:</label>
                  <input type="datetime-local" id="arrival_time" name="arrival_time" class="form-control"
                      {% if schedule %}value="{{ schedule.arrival_time|date:'Y-m-d\TH:i' }}"{% endif %} required>
                </div>
                <div class="form-group">
                  <label for="price">price:</label>
                  <input type="number" id="price" name="price" class="form-control" placeholder="8000" {% if schedule %}value="{{ schedule.price }}{% endif %}" required>
                </div>
                <button type="submit" class="btn btn-primary mr-2">{% if schedule %}Update{% else %}Create{% endif %}</button>
                <a href="{% url 'flight_schedule_list' %}" class="btn btn-light">Cancel</a>
              </form>
            </div>
          </div>
        </div>
        <!-- partial -->
      </div>
      <!-- main-panel ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->
  <!-- plugins:js -->
  <script src="{% static 'assets/vendors/js/vendor.bundle.base.js' %}"></script>
  <!-- endinject -->
  <!-- Plugin js for this page -->
  <script src="{% static 'assets/vendors/chart.js/Chart.min.js' %}"></script>
  <script src="{% static 'assets/vendors/progressbar.js/progressbar.min.js' %}"></script>
  <script src="{% static 'assets/vendors/jvectormap/jquery-jvectormap.min.js' %}"></script>
  <script src="{% static 'assets/vendors/jvectormap/jquery-jvectormap-world-mill-en.js' %}"></script>
  <script src="{% static 'assets/vendors/owl-carousel-2/owl.carousel.min.js' %}"></script>
  <script src="{% static 'assets/js/jquery.cookie.js' %}" type="text/javascript"></script>
  <!-- End plugin js for this page -->
  <!-- inject:js -->
  <script src="{% static 'assets/js/off-canvas.js' %}"></script>
  <script src="{% static 'assets/js/hoverable-collapse.js' %}"></script>
  <script src="{% static 'assets/js/misc.js' %}"></script>
  <script src="{% static 'assets/js/settings.js' %}"></script>
  <script src="{% static 'assets/js/todolist.js' %}"></script>
  <!-- endinject -->
  <!-- Custom js for this page -->
  <script src="{% static 'assets/js/dashboard.js' %}"></script>
  <!-- End custom js for this page -->
</body>
</html>
{% endblock %}
