{% extends "daashboard2.html" %}
{% load static %}

{%  block AdminBody %}

<body>
      <!-- partial -->
          <!-- Form starts here -->
          <div class="page-header">
            <h3 class="page-title"> Add New Bus </h3>
          </div>
          <div class="row">
            <div class="col-md-6 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Bus Information</h4>
                  <form class="forms-sample" method="POST" action="{% url 'addbus' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="bus_number">Bus Number</label>
                        <input type="text" name="bus_number" class="form-control" id="bus_number" placeholder="Bus Number" required>
                    </div>
                    <div class="form-group">
                        <label for="capacity">Bus Capacity</label>
                        <input type="text" name="capacity" class="form-control" id="capacity" placeholder="Capacity" required>
                    </div>
                    <div class="form-group">
                        <label for="start_point">From location</label>
                        <select name="start_point" class="form-control" id="start_point" required>
                            <option value="" disabled selected>Select starting location</option>
                            {% for location in locations %}
                                <option value="{{ location.loc_id }}">{{ location.location_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="end_point">To location</label>
                        <select name="end_point" class="form-control" id="end_point" required>
                            <option value="" disabled selected>Select destination</option>
                            {% for location in locations %}
                                <option value="{{ location.loc_id }}">{{ location.location_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="timing">Timing</label>
                        <input type="time" name="timing" class="form-control" id="timing" placeholder="Timing" required>
                    </div>
                    <button type="submit" class="btn btn-primary mr-2">Submit</button>
                    <button type="reset" class="btn btn-light">Cancel</button>
                </form>                
                </div>
              </div>
            </div>
          </div>
          <!-- Form ends here -->
        </div>
      </div>
      <!-- main-panel ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->
  <!-- plugins:js -->
  <script src="{% static 'assets/vendors/js/vendor.bundle.base.js' %}"></script>
  <!-- endinject -->
  <!-- Plugin js for this page -->
  <script src="{% static 'assets/vendors/chart.js/Chart.min.js' %}"></script>
  <script src="{% static 'assets/vendors/progressbar.js/progressbar.min.js' %}"></script>
  <script src="{% static 'assets/vendors/jvectormap/jquery-jvectormap.min.js' %}"></script>
  <script src="{% static 'assets/vendors/jvectormap/jquery-jvectormap-world-mill-en.js' %}"></script>
  <script src="{% static 'assets/vendors/owl-carousel-2/owl.carousel.min.js' %}"></script>
  <script src="{% static 'assets/js/jquery.cookie.js' %}" type="text/javascript"></script>
  <!-- End plugin js for this page -->
  <!-- inject:js -->
  <script src="{% static 'assets/js/off-canvas.js' %}"></script>
  <script src="{% static 'assets/js/hoverable-collapse.js' %}"></script>
  <script src="{% static 'assets/js/misc.js' %}"></script>
  <script src="{% static 'assets/js/settings.js' %}"></script>
  <script src="{% static 'assets/js/todolist.js' %}"></script>
  <!-- endinject -->
  <!-- Custom js for this page -->
  <script src="{% static 'assets/js/dashboard.js' %}"></script>
  <!-- End custom js for this page -->
</body>
</html>
{% endblock %}
