{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        body {
            background: url("{%static 'back.png' %}") no-repeat center center fixed; /* Replace with your image URL */
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Roboto', sans-serif;
            margin: 0;
        }

        .container {
            background: rgba(73, 31, 31, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .signup-form h2 {
            margin-bottom: 20px;
            color: #e8baba;
            font-weight: 700;
        }

        .signup-form p {
            color: #b1a3a3;
            margin-bottom: 30px;
        }

        .signup-form label {
            display: block;
            margin-bottom: 10px;
            color: #e8dcdc;
            text-align: left;
            font-weight: 500;
        }

        .signup-form input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .signup-form button {
            background: linear-gradient(90deg, #ff6a00, #ee0979);
            color: #fff;
            padding: 15px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            transition: background 0.3s ease;
        }

        .signup-form button:hover {
            background: linear-gradient(90deg, #ee0979, #ff6a00);
        }

        .login-link {
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #ff6a00;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="signup-form">
            <h2>Sign Up</h2>
            <p>Welcome to Our Community!</p>
            <form method="POST" action="{% url 'process_registration' %}" >
                {% csrf_token %}
                <label for="username">User Name</label>
                <input type="text" id="username" name ="username" placeholder="Enter your full name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name ="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name ="password" placeholder="Enter your password" required>

                <button type="submit">Sign Up</button>
            </form>
            <div class="login-link">
                <p>Already registered? <a href="{% url 'login' %}">Login here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
