{% extends "daashboard2.html" %}
{% load static %}

{%  block AdminBody %}

          <!-- Form starts here -->
          <div class="page-header">
            <h3 class="page-title"> Add New Airport </h3>
          </div>
          <div class="row">
            <div class="col-md-6 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                    <h1>{% if airport %} Edit Airport {% else %} Add New Airport{% endif %}</h1>
                    <form class="forms-sample" method="post">
                      {% csrf_token %}
                      <label for="name">Name:</label>
                      <input type="text" id="name" class="form-control" name="name" value="{{ airport.name }}" required><br>
                      
                      <label for="code">Code:</label>
                      <input type="text" id="code" class="form-control" name="code" value="{{ airport.code }}" required><br>
                      
                      <label for="city">City:</label>
                      <input type="text" id="city" class="form-control" name="city" value="{{ airport.city }}" required><br>
                      
                      <label for="country">Country:</label>
                      <input type="text" id="country" class="form-control" name="country" value="{{ airport.country }}" required><br>
                  
                      <button type="submit">{% if airport %}Update{% else %}Create{% endif %}</button>
                      
                      {% if airport %}
                      <input type="hidden" name="airport_id" value="{{ airport.id }}">
                      {% endif %}
                  </form>
                                 
                </div>
              </div>
            </div>
          </div>
          <!-- Form ends here -->
        </div>
        <!-- partial -->
      </div>
      <!-- main-panel ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->
  <!-- plugins:js -->
  <script src="{% static 'assets/vendors/js/vendor.bundle.base.js' %}"></script>
  <!-- endinject -->
  <!-- Plugin js for this page -->
  <script src="{% static 'assets/vendors/chart.js/Chart.min.js' %}"></script>
  <script src="{% static 'assets/vendors/progressbar.js/progressbar.min.js' %}"></script>
  <script src="{% static 'assets/vendors/jvectormap/jquery-jvectormap.min.js' %}"></script>
  <script src="{% static 'assets/vendors/jvectormap/jquery-jvectormap-world-mill-en.js' %}"></script>
  <script src="{% static 'assets/vendors/owl-carousel-2/owl.carousel.min.js' %}"></script>
  <script src="{% static 'assets/js/jquery.cookie.js' %}" type="text/javascript"></script>
  <!-- End plugin js for this page -->
  <!-- inject:js -->
  <script src="{% static 'assets/js/off-canvas.js' %}"></script>
  <script src="{% static 'assets/js/hoverable-collapse.js' %}"></script>
  <script src="{% static 'assets/js/misc.js' %}"></script>
  <script src="{% static 'assets/js/settings.js' %}"></script>
  <script src="{% static 'assets/js/todolist.js' %}"></script>
  <!-- endinject -->
  <!-- Custom js for this page -->
  <script src="{% static 'assets/js/dashboard.js' %}"></script>
  <!-- End custom js for this page -->
</body>
</html>
{% endblock %}
